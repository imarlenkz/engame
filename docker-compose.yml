# EnGame production stack. The host nginx terminates TLS for engame.imarlen.kz and proxies to the
# gateway on 127.0.0.1:${GATEWAY_PORT}. See docs/DEPLOY.md.
name: engame

x-api-env: &api-env
  NODE_ENV: production
  APP_ORIGIN: ${APP_ORIGIN}
  APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
  DATABASE_URL: postgresql://${POSTGRES_USER:-engame}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-engame}
  REDIS_URL: redis://redis:6379
  TIMEZONE: ${TIMEZONE:-Asia/Almaty}
  # host nginx -> gateway nginx -> api
  TRUST_PROXY_HOPS: 2
  AUTH_LOCAL_REGISTRATION: ${AUTH_LOCAL_REGISTRATION:-true}
  OIDC_ISSUER: ${OIDC_ISSUER:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  STORAGE_LOCAL_DIR: /data/uploads
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  SPEECH_PROVIDER: ${SPEECH_PROVIDER:-none}
  SPEECH_API_URL: ${SPEECH_API_URL:-}
  SPEECH_API_KEY: ${SPEECH_API_KEY:-}
  SPEECH_MODEL: ${SPEECH_MODEL:-whisper-1}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  SWAGGER_PUBLIC: ${SWAGGER_PUBLIC:-false}
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-logging: &logging
  driver: json-file
  options: { max-size: '20m', max-file: '5' }

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-engame}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-engame}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '256mb', '--maxmemory-policy', 'noeviction']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    logging: *logging

  # One-off: database migrations + idempotent starter content. `docker compose run --rm migrate`
  migrate:
    build: { context: ., dockerfile: infra/docker/Dockerfile, target: tools, args: { NODE_IMAGE: '${NODE_IMAGE:-node:22.20.0-bookworm-slim}' } }
    image: engame-tools:${ENGAME_VERSION:-latest}
    profiles: [tools]
    environment: *api-env
    command: ['sh', '-c', 'pnpm --filter @engame/database migrate:deploy && pnpm --filter @engame/database seed']
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]

  api:
    build: { context: ., dockerfile: infra/docker/Dockerfile, target: api, args: { NODE_IMAGE: '${NODE_IMAGE:-node:22.20.0-bookworm-slim}' } }
    image: engame-api:${ENGAME_VERSION:-latest}
    init: true
    restart: unless-stopped
    environment: *api-env
    volumes: [uploads:/data/uploads]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal]
    logging: *logging

  web:
    build: { context: ., dockerfile: infra/docker/Dockerfile, target: web, args: { NODE_IMAGE: '${NODE_IMAGE:-node:22.20.0-bookworm-slim}' } }
    image: engame-web:${ENGAME_VERSION:-latest}
    init: true
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    networks: [internal]
    logging: *logging

  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    volumes: ['./infra/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro']
    ports: ['127.0.0.1:${GATEWAY_PORT:-4300}:80']
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    networks: [internal]
    logging: *logging

  # Optional: `docker compose --profile monitoring up -d` (Prometheus on 127.0.0.1:9090)
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    restart: unless-stopped
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=30d']
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./infra/monitoring/metrics_token:/etc/prometheus/metrics_token:ro
      - promdata:/prometheus
    ports: ['127.0.0.1:9090:9090']
    networks: [internal]
    logging: *logging

volumes:
  pgdata:
  redisdata:
  uploads:
  promdata:

networks:
  internal:
