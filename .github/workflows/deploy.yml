name: Deploy

# Deploys main to the VPS after CI passes, or on demand.
# Repository secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (private key), VPS_KNOWN_HOSTS (ssh-keyscan output).
# Optional variable: VPS_PATH (default /opt/engame). The server keeps its own .env; no secrets live in the repo.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://engame.imarlen.kz
    steps:
      - name: Check secrets
        env:
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$HOST" ]; then echo "::error::VPS_HOST secret is not set; nothing deployed"; exit 1; fi
      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          DIR: ${{ vars.VPS_PATH || '/opt/engame' }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy "$USER@$HOST" "set -e; cd '$DIR'; git fetch --quiet origin main; git checkout --quiet --detach '$SHA'; ENGAME_VERSION='${SHA::7}' infra/scripts/deploy.sh"
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do curl -fsS https://engame.imarlen.kz/api/v1/ready && exit 0; sleep 5; done
          exit 1
