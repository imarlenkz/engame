# Host nginx site for engame.imarlen.kz -> EnGame gateway on 127.0.0.1:4300.
# Install: see docs/DEPLOY.md (certbot issues the certificate with the webroot below).

server {
  listen 80;
  listen [::]:80;
  server_name engame.imarlen.kz;

  location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name engame.imarlen.kz;

  ssl_certificate     /etc/letsencrypt/live/engame.imarlen.kz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/engame.imarlen.kz/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:engame_ssl:10m;
  ssl_session_timeout 1d;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  client_max_body_size 12m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  location / {
    proxy_pass http://127.0.0.1:4300;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }
}
