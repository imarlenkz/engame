# In-stack gateway: one port for the host nginx; /api goes straight to the API, everything else to Next.js.
upstream engame_api { server api:4000; keepalive 16; }
upstream engame_web { server web:3000; keepalive 16; }

# Keep the client address chain from the host nginx and append ours (API trusts 2 hops).
map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; '' $scheme; }

server {
  listen 80;
  server_name _;
  client_max_body_size 12m;  # media uploads (API enforces its own per-type limits)

  proxy_http_version 1.1;
  proxy_set_header Connection '';
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $fwd_proto;
  proxy_set_header X-Request-Id $request_id;

  location /api/ {
    proxy_pass http://engame_api;
    proxy_read_timeout 60s;
  }

  # Metrics are for Prometheus inside the stack only.
  location = /api/v1/metrics { return 404; }

  location /_next/static/ {
    proxy_pass http://engame_web;
    add_header Cache-Control 'public, max-age=31536000, immutable';
  }

  location / {
    proxy_pass http://engame_web;
  }
}
