groups:
  - name: engame
    rules:
      - alert: EngameApiDown
        expr: up{job="engame-api"} == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: 'EnGame API is not answering metrics scrapes' }
      - alert: EngameHigh5xxRate
        expr: |
          sum(rate(engame_http_request_duration_seconds_count{status=~"5.."}[5m]))
            / clamp_min(sum(rate(engame_http_request_duration_seconds_count[5m])), 1e-9) > 0.05
        for: 10m
        labels: { severity: warning }
        annotations: { summary: 'More than 5% of API requests fail with 5xx' }
      - alert: EngameSlowRequests
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(engame_http_request_duration_seconds_bucket[5m]))) > 1.5
        for: 15m
        labels: { severity: warning }
        annotations: { summary: 'p95 API latency above 1.5 s' }
